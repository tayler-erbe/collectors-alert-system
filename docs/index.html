<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f2;--panel:#fff;--ink:#16181a;--muted:#5d646b;--line:#dfe2dc;--live:#d6331f;--soon:#c98a07;--info:#6b7480;--ok:#2f8a4a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101214;--panel:#181b1e;--ink:#eceeea;--muted:#9aa2a9;--line:#2a2f33;--live:#ff5a43;--soon:#f0b429;--info:#8b949e;--ok:#4cc27a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Mono",ui-monospace,monospace;padding:24px 16px}
.wrap{max-width:1000px;margin:0 auto}
h1{font:700 30px/1.1 "Space Grotesk",system-ui,sans-serif;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.bar button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.bar button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ev{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.lv{font-weight:500;font-size:12px;letter-spacing:.06em;text-align:center;border-radius:6px;padding:2px 0;color:#fff}
.LIVE{background:var(--live)}.SOON{background:var(--soon)}.INFO{background:var(--info)}
.ev a{color:var(--ink);font-weight:500;text-decoration:none;word-break:break-word}
.ev a:hover{text-decoration:underline}
.meta{color:var(--muted);font-size:13px}
.t{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
h2{font:700 18px "Space Grotesk",system-ui,sans-serif;margin:28px 0 10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--ok)}
.dot.bad{background:var(--live)}.dot.paused{background:var(--info)}
.empty{color:var(--muted);padding:20px 0}
@media (max-width:560px){.ev{grid-template-columns:52px 1fr}.t{grid-column:2}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Drop Radar</h1>
  <p style="margin:0 0 6px"><a href="dino.html" style="color:var(--live);font-weight:500">🦖 Breaking: Dinosaurs loose in Scripps Ranch</a></p>
  <p class="sub" id="sub">Loading…</p>
  <div class="bar" id="bar">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="LIVE" aria-pressed="false">Live now</button>
    <button data-f="SOON" aria-pressed="false">Coming</button>
    <button data-f="INFO" aria-pressed="false">Changes</button>
  </div>
  <div id="events"></div>
  <h2>Watched sources</h2>
  <div class="tbl"><table><thead><tr><th>Source</th><th>Type</th><th>Every</th><th>Last OK</th><th>Note</th></tr></thead><tbody id="src"></tbody></table></div>
</div>
<script>
let data=null,filter="all";
const ago=t=>{if(!t)return"never";const s=Math.round(Date.now()/1000-t);if(s<90)return s+"s ago";if(s<5400)return Math.round(s/60)+"m ago";if(s<172800)return Math.round(s/3600)+"h ago";return Math.round(s/86400)+"d ago"};
function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
function render(){
  if(!data)return;
  document.getElementById("sub").textContent=`${data.sources.length} sources watched · updated ${ago(data.updated)} · alerts go to his phone instantly; this page refreshes every few minutes`;
  const ev=data.events.filter(e=>filter==="all"||e.level===filter);
  document.getElementById("events").innerHTML=ev.length?ev.slice(0,150).map(e=>`<div class="ev"><div class="lv ${e.level}">${e.level==="SOON"?"SOON":e.level}</div><div><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a><div class="meta">${esc(e.source_name)}${e.detail?" · "+esc(e.detail):""}</div></div><div class="t">${ago(e.t)}</div></div>`).join(""):'<div class="empty">Nothing yet. New drops appear here as they are found.</div>';
  document.getElementById("src").innerHTML=data.sources.map(s=>`<tr><td><span class="dot ${s.paused?"paused":s.err?"bad":""}"></span><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a></td><td>${s.kind==="rss"?"news":s.kind==="queue"?"waiting room":s.kind==="shopify"?"store":"page"}</td><td>${s.paused?"paused":Math.max(1,Math.round(s.interval_s/60))+" min"}</td><td>${s.paused?"":ago(s.ok)}</td><td>${esc(s.paused?s.note:(s.err?"site is blocking checks right now; retrying":""))}</td></tr>`).join("");
}
async function load(){try{const r=await fetch("data.json?"+Date.now());data=await r.json();render()}catch(e){document.getElementById("sub").textContent="No data yet: the checker has not published its first update."}}
document.getElementById("bar").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.f;document.querySelectorAll("#bar button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
load();setInterval(load,120000);
</script>
</body>
</html>
